name: Deploy Pages with smoke-map cache

on:
  push:
    branches: ["master"]
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages-artifact-id: ${{ steps.pages-artifact.outputs.artifact_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install cache build dependencies
        run: python -m pip install --disable-pip-version-check boto3 numpy pillow

      - name: Run smoke-map regression checks
        run: python na_smoke_map/scripts/test_static_contracts.py

      - name: Select model-cycle cache key
        id: model-cycle
        run: |
          cycle="$(
            python -c 'import datetime as d; t=d.datetime.now(d.timezone.utc)-d.timedelta(hours=7); print(t.strftime("%Y%m%d") + ("12" if t.hour >= 12 else "00"))'
          )"
          echo "cycle=$cycle" >> "$GITHUB_OUTPUT"

      - name: Assemble site
        run: |
          mkdir -p _site/mbta/assets _site/na_smoke_map/icons _site/na_smoke_map/cache
          cp .nojekyll favicon.ico _site/
          cp mbta/index.html mbta/app.js mbta/style.css mbta/privacy.html mbta/site.webmanifest _site/mbta/
          cp mbta/assets/mbta-transport-icon.png _site/mbta/assets/
          cp na_smoke_map/index.html na_smoke_map/style.css na_smoke_map/app.js na_smoke_map/site.webmanifest _site/na_smoke_map/
          rsync -a na_smoke_map/icons/ _site/na_smoke_map/icons/
          rsync -a na_smoke_map/cache/ _site/na_smoke_map/cache/

      - name: Restore rolling frame cache
        uses: actions/cache/restore@v4
        with:
          path: _frame-cache
          # A per-run key keeps the rolling source cache appendable. The exact
          # model-cycle key was immutable after its first save, so later hourly
          # runs restored it but could never persist newly downloaded history.
          key: raqdps-v5-${{ steps.model-cycle.outputs.cycle }}-${{ github.run_id }}
          restore-keys: |
            raqdps-v5-${{ steps.model-cycle.outputs.cycle }}-
            raqdps-v5-

      - name: Build hourly WFIGS wildfire cache
        run: |
          python na_smoke_map/scripts/build_wildfire_cache.py \
            --output _frame-cache/site-cache/wildfires \
            --jobs 2 \
            --retries 3

      - name: Build hourly CWFIS and CIFFC Canadian wildfire cache
        run: |
          python na_smoke_map/scripts/build_canada_wildfire_cache.py \
            --output _frame-cache/site-cache/canada-wildfires \
            --retries 3

      - name: Build hourly NOAA HMS smoke cache
        run: |
          python na_smoke_map/scripts/build_hms_cache.py \
            --output _frame-cache/site-cache/hms \
            --archive-lookback-days 14 \
            --retries 3

      - name: Build same-origin PM2.5 frame cache
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          build_args=(
            --output _frame-cache/site-cache
            --raw-output _frame-cache/source-cache
            --history-hours 64
            --forecast-hours 64
            --jobs 8
            --minimum-success-ratio 0.8
          )
          if [ -n "$R2_PUBLIC_BASE_URL" ] && [ -n "$R2_BUCKET" ] && [ -n "$R2_ENDPOINT_URL" ] && [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
            build_args+=(--asset-base-url "$R2_PUBLIC_BASE_URL")
          fi

          python na_smoke_map/scripts/build_static_cache.py "${build_args[@]}"

      - name: Publish immutable field atlases to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_PREFIX: ${{ secrets.R2_PREFIX }}
        run: |
          if [ -z "$R2_BUCKET" ] || [ -z "$R2_ENDPOINT_URL" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "R2 is not configured; field atlases will remain in the Pages artifact."
            exit 0
          fi
          python na_smoke_map/scripts/publish_r2_cache.py \
            --root _frame-cache/site-cache \
            --manifest _frame-cache/site-cache/manifest.json \
            --bucket "$R2_BUCKET" \
            --endpoint-url "$R2_ENDPOINT_URL" \
            --prefix "$R2_PREFIX"

      - name: Copy PM2.5 cache into the Pages artifact
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          if [ -n "$R2_PUBLIC_BASE_URL" ] && [ -n "$R2_BUCKET" ] && [ -n "$R2_ENDPOINT_URL" ] && [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
            mkdir -p _site/na_smoke_map/cache
            cp _frame-cache/site-cache/manifest.json _site/na_smoke_map/cache/manifest.json
            mkdir -p _site/na_smoke_map/cache/wildfires
            rsync -a --delete \
              _frame-cache/site-cache/wildfires/ \
              _site/na_smoke_map/cache/wildfires/
            mkdir -p _site/na_smoke_map/cache/canada-wildfires
            rsync -a --delete \
              _frame-cache/site-cache/canada-wildfires/ \
              _site/na_smoke_map/cache/canada-wildfires/
            mkdir -p _site/na_smoke_map/cache/hms
            rsync -a --delete \
              _frame-cache/site-cache/hms/ \
              _site/na_smoke_map/cache/hms/
            rm -rf _site/na_smoke_map/cache/fields _site/na_smoke_map/cache/frames
          else
            rsync -a --delete \
              _frame-cache/site-cache/ \
              _site/na_smoke_map/cache/
          fi

      - name: Save rolling frame cache
        uses: actions/cache/save@v4
        with:
          path: _frame-cache
          key: raqdps-v5-${{ steps.model-cycle.outputs.cycle }}-${{ github.run_id }}

      - name: Remove superseded rolling caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          legacy_ids="$(
            gh api "repos/${{ github.repository }}/actions/caches?per_page=100" \
              --jq '.actions_caches[] | select(.key | startswith("raqdps-frames-")) | .id'
          )"
          for cache_id in $legacy_ids; do
            gh cache delete "$cache_id"
          done

          old_ids="$(
            gh api "repos/${{ github.repository }}/actions/caches?per_page=100" \
              --jq '[.actions_caches[] | select(.key | startswith("raqdps-v5-"))] | sort_by(.created_at) | reverse | .[2:][] | .id'
          )"
          for cache_id in $old_ids; do
            gh cache delete "$cache_id"
          done

      - name: Upload Pages artifact
        id: pages-artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Pages serves its deployed copy; older upload packages are no longer
      # needed. Only clean up after deployment succeeds, keeping this run's
      # artifact and all unfinished, newer, or unrelated workflow runs.
      - name: Remove superseded Pages artifacts
        id: cleanup
        if: ${{ success() && steps.deployment.outcome == 'success' }}
        continue-on-error: true
        env:
          PAGES_ARTIFACT_ID: ${{ needs.build.outputs.pages-artifact-id }}
        uses: actions/github-script@v8
        with:
          script: |
            const repo = context.repo;
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) {
              throw new Error('Missing current Pages artifact ID; refusing cleanup.');
            }
            const { data: currentRun } = await github.rest.actions.getWorkflowRun({
              ...repo, run_id: context.runId
            });
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              ...repo, name: 'github-pages', per_page: 100
            });
            const current = artifacts.find(artifact => artifact.id === artifactId);
            if (!current || current.expired || current.name !== 'github-pages' ||
                current.workflow_run?.id !== context.runId) {
              throw new Error('Current Pages artifact not verified; refusing cleanup.');
            }

            const candidates = [];
            for (const artifact of artifacts) {
              if (artifact.id === artifactId || artifact.expired ||
                  artifact.name !== 'github-pages' || !artifact.workflow_run?.id ||
                  artifact.workflow_run.id === context.runId ||
                  !(Date.parse(artifact.created_at) < Date.parse(current.created_at))) continue;
              const { data: run } = await github.rest.actions.getWorkflowRun({
                ...repo, run_id: artifact.workflow_run.id
              });
              if (run.status === 'completed' && run.workflow_id === currentRun.workflow_id &&
                  run.head_branch === currentRun.head_branch &&
                  Date.parse(run.created_at) < Date.parse(currentRun.created_at)) {
                candidates.push(artifact);
              }
            }

            const mib = bytes => (bytes / 1024 / 1024).toFixed(1);
            let deleted = 0, freedBytes = 0, failures = 0;
            for (const artifact of candidates) {
              core.info(`Deleting old Pages artifact ${artifact.id} from run ${artifact.workflow_run.id} (${mib(artifact.size_in_bytes)} MiB)`);
              try {
                await github.rest.actions.deleteArtifact({ ...repo, artifact_id: artifact.id });
                deleted++;
                freedBytes += artifact.size_in_bytes;
              } catch (error) {
                failures++;
                core.warning(`Could not delete artifact ${artifact.id}: ${error.message}`);
              }
            }
            core.info(`Kept current Pages artifact ${artifactId}; deleted ${deleted} older artifacts (${mib(freedBytes)} MiB).`);
            await core.summary
              .addHeading('Pages artifact cleanup')
              .addTable([
                [{data: 'Result', header: true}, {data: 'Value', header: true}],
                ['Kept current artifact', `${artifactId} (${mib(current.size_in_bytes)} MiB)`],
                ['Deleted older artifacts', String(deleted)],
                ['Freed storage', `${mib(freedBytes)} MiB`],
                ['Deletion failures', String(failures)]
              ])
              .addRaw('\nRolling frame caches and deployed website files are unchanged. Artifacts still expire after one day.\n')
              .write();
            if (failures) core.setFailed(`${failures} artifact deletion(s) failed.`);

      - name: Report incomplete artifact cleanup
        if: ${{ success() && steps.cleanup.outcome == 'failure' }}
        run: |
          echo "::warning::Pages deployed successfully, but artifact cleanup was incomplete. Inspect the cleanup log; one-day artifact expiration remains enabled."
          echo "### Artifact cleanup needs attention" >> "$GITHUB_STEP_SUMMARY"
          echo "Pages deployed successfully. Cleanup was incomplete; inspect the cleanup log. One-day artifact expiration remains enabled." >> "$GITHUB_STEP_SUMMARY"
